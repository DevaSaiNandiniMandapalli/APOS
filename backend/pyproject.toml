[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apos-api"
version = "0.2.0"
description = "APOS processing service: browser-local tools plus optional self-hosted document engines"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9",
  "pypdf>=4.2,<7",
  "cryptography>=42",
  "pikepdf>=9.0",
  "pypdfium2>=4.30",
  "img2pdf>=0.5",
  "reportlab>=4.1",
  "pdf2docx>=0.5.8",
  "pyhanko>=0.25",
  "python-pptx>=1.0",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "weasyprint>=62",
  "pillow>=10",
]

[project.optional-dependencies]
ocr = ["ocrmypdf>=16.0"]
ai = ["anthropic>=0.40"]
test = ["pytest>=8.3,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["apos_api*", "apos_processing*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
